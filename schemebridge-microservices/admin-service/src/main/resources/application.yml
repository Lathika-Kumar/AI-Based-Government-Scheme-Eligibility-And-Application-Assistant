spring:
  application:
    name: admin-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 2000
        max-interval: 10000
        max-attempts: 6
        multiplier: 1.5
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
