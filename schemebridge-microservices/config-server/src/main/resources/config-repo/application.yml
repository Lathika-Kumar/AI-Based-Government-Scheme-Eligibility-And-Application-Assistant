# Shared Default Configuration for SchemeBridge Microservices Ecosystem
# Namespace: schemebridge.*

spring:
  profiles:
    include:
      - secrets

# JWT Security Defaults
jwt:
  secret: ${JWT_SECRET:schemeBridgeEnterpriseJwtSecretKey2026SuperSecureKeyMustBeAtLeast512BitsLongForHMACSHA512SigningAlgorithmCompliance}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Brevo Email Defaults
brevo:
  api-key: ${BREVO_API_KEY:xkeysib-placeholder-test-key-2026}
  sender-email: ${BREVO_SENDER_EMAIL:noreply@schemebridge.gov.in}
  sender-name: ${BREVO_SENDER_NAME:SchemeBridge Government Portal Authentication}


schemebridge:
  version: "1.0.0-MODULE12"
  environment: "${spring.profiles.active:development}"
  features:
    notifications:
      enabled: true
    redis:
      enabled: false
    kafka:
      enabled: false
    sms:
      enabled: true
    email:
      enabled: true
    ai:
      enabled: true
      provider: gemini
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      api-version: ${GEMINI_API_VERSION:v1beta}
      endpoint-url: https://generativelanguage.googleapis.com/${integration.ai.api-version:v1beta}/models/{model}:generateContent

    document:
      versioning:
        enabled: true
    audit:
      enabled: true
    analytics:
      enabled: true

# Feature flags flat aliases for backward compatibility and @Value compatibility
feature:
  notifications:
    enabled: true
  redis:
    enabled: false
  kafka:
    enabled: false
  sms:
    enabled: true
  email:
    enabled: true
  ai:
    enabled: true
  document:
    versioning:
      enabled: true
  audit:
    enabled: true
  analytics:
    enabled: true

# Eureka Client Shared Defaults
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30


# Common Actuator Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,mappings,configprops,refresh
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true

# Common Logging Defaults
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.schemebridge: DEBUG
    org.springframework.cloud.config: INFO

# OpenAPI / Swagger Shared Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Future Cloud & Middleware Infrastructure Readiness Placeholders
infrastructure:
  cache:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  messaging:
    kafka:
      bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    rabbitmq:
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_PORT:5672}
  search:
    elasticsearch:
      uris: ${ELASTICSEARCH_URI:http://localhost:9200}
  observability:
    prometheus:
      enabled: true
    grafana:
      enabled: true
    opentelemetry:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
    zipkin:
      tracing:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  cloud:
    provider: ${CLOUD_PROVIDER:local} # local, aws, azure, gcp
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
