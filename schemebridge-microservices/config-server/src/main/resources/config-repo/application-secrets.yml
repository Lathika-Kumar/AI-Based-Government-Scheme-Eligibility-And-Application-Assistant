# Centralized Secret Management Repository File
# Sensitive credentials mapped to Environment Variables with secure local defaults

jwt:
  secret: ${JWT_SECRET:schemeBridgeEnterpriseJwtSecretKey2026SuperSecureKeyMustBeAtLeast512BitsLongForHMACSHA512SigningAlgorithmCompliance}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 Days

brevo:
  api-key: ${BREVO_API_KEY:xkeysib-placeholder-test-key-2026}
  sender-email: ${BREVO_SENDER_EMAIL:noreply@schemebridge.gov.in}
  sender-name: ${BREVO_SENDER_NAME:SchemeBridge Government Portal Authentication}

schemebridge:
  security:
    jwt-secret: ${jwt.secret}
    jwt-expiration-ms: ${jwt.expiration-ms}
    jwt-refresh-expiration-ms: ${jwt.refresh-expiration-ms}
  email:
    brevo-api-key: ${brevo.api-key}
    sender-email: ${brevo.sender-email}
    sender-name: ${brevo.sender-name}
  sms:
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:AC_test_placeholder_sid}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:auth_token_placeholder}
    twilio-from-number: ${TWILIO_FROM_NUMBER:+18005550199}
  push:
    firebase-credentials-path: ${FCM_CREDENTIALS_PATH:classpath:fcm-placeholder.json}
