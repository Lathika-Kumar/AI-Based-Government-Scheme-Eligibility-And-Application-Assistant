spring:
  application:
    name: schemebridge-auth-service
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}
          connectiontimeout: ${SPRING_MAIL_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_TIMEOUT:5000}
  datasource:

    url: ${ORACLE_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:${SERVER_PORT:8080}}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false


otp:
  log-raw-value: ${OTP_LOG_RAW_VALUE:true}

mail:
  from: ${SPRING_MAIL_FROM:noreply@schemebridge.gov.in}
  from-name: ${SPRING_MAIL_FROM_NAME:SchemeBridge Portal}

brevo:
  enabled: ${BREVO_EMAIL_ENABLED:${BREVO_ENABLED:false}}
  api-key: ${BREVO_API_KEY:${brevo.api-key:}}
  sender-email: ${BREVO_SENDER_EMAIL:${brevo.sender-email:}}
  sender-name: ${BREVO_SENDER_NAME:${brevo.sender-name:SchemeBridge}}
  endpoint: ${BREVO_API_ENDPOINT:https://api.brevo.com/v3/smtp/email}

