version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: schemebridge-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schemebridge-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/schemebridge
      JWT_SECRET: ${JWT_SECRET:-SchemeBridgeSuperSecretKeyForJWTSigningMustBeAtLeast256BitsLongForSecurity2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
